[project]
name = "matchlab-workspace"
version = "0.1.0"
description = "MatchLab monorepo workspace root"
requires-python = ">=3.11"
dependencies = [
    "matchlab-core",
    "matchlab-server",
    "matchlab-train",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/matchlab_core",
    "packages/matchlab_server",
    "packages/matchlab_train",
]

[tool.uv.sources]
matchlab-core = { workspace = true }
matchlab-server = { workspace = true }
matchlab-train = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]
# Real CV stages (GPU workers): uv sync --group cv
cv = ["matchlab-core[cv]"]
# Face identity path (see license note in matchlab_core pyproject)
face = ["matchlab-core[face]"]
# MOT evaluation against ground truth: uv sync --group eval
eval = ["matchlab-core[eval]"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party code — unmodified except the mechanical edits
# recorded in each vendor README — excluded rather than reformatted to
# upstream's style to keep diffs against upstream minimal and auditable.
extend-exclude = [
    "**/_vendor/**",
    "packages/matchlab_core/src/matchlab_core/vendor/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is advisory. B008: FastAPI Depends() idiom. B905: py<3.10
# compat not needed but strict= noise isn't worth it. UP042: str+Enum is the
# SQLAlchemy-values pattern. B027: Stage.prepare is an intentional no-op hook.
ignore = ["E501", "B008", "B905", "UP042", "B027"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
markers = [
    "slow: real-model smoke test (network/heavy deps); gated by an env var, skipped by default",
]
