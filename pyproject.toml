[project]
name = "pitchlab-workspace"
version = "0.1.0"
description = "PitchLab monorepo workspace root"
requires-python = ">=3.11"
dependencies = [
    "pitchlab-core",
    "pitchlab-server",
    "pitchlab-train",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/pitchlab_core",
    "packages/pitchlab_server",
    "packages/pitchlab_train",
]

[tool.uv.sources]
pitchlab-core = { workspace = true }
pitchlab-server = { workspace = true }
pitchlab-train = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]
# Real CV stages (GPU workers): uv sync --group cv
cv = ["pitchlab-core[cv]"]
# Face identity path (see license note in pitchlab_core pyproject)
face = ["pitchlab-core[face]"]
# MOT evaluation against ground truth: uv sync --group eval
eval = ["pitchlab-core[eval]"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party source (unmodified except numpy-2 compat patches,
# see the file headers) is excluded rather than reformatted to upstream's
# style -- keeps diffs against upstream minimal and auditable.
extend-exclude = [
    "**/_vendor/**",
    "packages/pitchlab_core/src/pitchlab_core/vendor/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is advisory. B008: FastAPI Depends() idiom. B905: py<3.10
# compat not needed but strict= noise isn't worth it. UP042: str+Enum is the
# SQLAlchemy-values pattern. B027: Stage.prepare is an intentional no-op hook.
ignore = ["E501", "B008", "B905", "UP042", "B027"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
markers = [
    "slow: real-model smoke test (network/heavy deps); gated by an env var, skipped by default",
]
