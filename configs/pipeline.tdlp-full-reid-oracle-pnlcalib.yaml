# TDLP-full oracle re-ID condition, but with PnLCalib camera calibration
# ENABLED. Identical to pipeline.tdlp-full-reid-oracle.yaml except the
# `calibrate` stage: that config disables calibration on purpose because a
# *synthetic* (static-demo) homography would feed bogus metric speeds into the
# re-ID engine's motion gate. PnLCalib provides a *real* per-frame homography,
# so calibration is both safe to enable and visible in the Lab's "Pitch
# keypoints" overlay (the stage reprojects the pitch template vertices into the
# image). The re-ID engine's metric motion gate now uses real pitch speeds.
#
# Requires BOTH sibling external envs:
#   - external-trackers/ (TDLP-full; see configs/pipeline.tdlp-full.yaml)
#   - external-calibrators/ (PnLCalib; see docs/reference/external-calibrators-setup.md)
name: tdlp-full-reid-oracle-pnlcalib
description: >
  Oracle (GT-box) detections + SOTA TDLP-full tracker + reid-engine
  association with oracle jersey anchors, plus PnLCalib pitch calibration
  (external sibling venv) surfaced in the Pitch keypoints overlay.
sport: soccer
# PnLCalib calibrates to real pitch geometry, so use the physically-correct
# FIFA pitch coordinate system (keypoints, minimap, and reid metric speeds all
# consistent). yolo-pitch-local runs keep the default roboflow template.
pitch: fifa
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: oracle
    params: {}
  track:
    impl: tdlp-full
    params:
      device: cuda:0
      timeout_s: 7200.0
      keep_work: false
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: pnlcalib
    params:
      command:
        - "../external-calibrators/PnLCalib/.venv/bin/python"
        - "../external-calibrators/pnlcalib_cli.py"
      weights_kp: "../external-calibrators/PnLCalib/weights/SV_kp"
      weights_line: "../external-calibrators/PnLCalib/weights/SV_lines"
      kp_threshold: 0.3434
      line_threshold: 0.7867
      pnl_refine: true
      device: cuda:0
  associate:
    impl: reid-engine
    params:
      min_similarity: 0.6
      overlap_tolerance_frames: 2
      max_prototypes: 4
      view_threshold: 0.7
      starved_max_frames: 2
      min_part_visibility: 0.3
      max_speed_px_s: 800.0
      max_speed_cm_s: 900.0
      soft_gap_s: 15.0
      gmc: true
      gmc_downscale: 2
      calibration_min_confidence: 0.5
      anchor_source: oracle-jersey
      anchor_coverage: 1.0
      anchor_noise: 0.0
      anchor_min_box_height: 0.0
      anchor_seed: 0
      min_posterior: 0.6
      min_margin: 0.2
      sinkhorn_iterations: 2
      tier_auto_min_posterior: 0.85
      tier_auto_min_margin: 0.5
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
