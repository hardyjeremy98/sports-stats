# TIER: LIVE (see configs/README.md) -- tracks the current best in every slot; upgrade on promotion.
# TDLP-full tracker wired natively into matchlab (research/local tool). The
# TRACK slot runs the SOTA offline TDLP-full stack — RTMPose keypoints + KPR
# 6-part appearance + the released `tdlp_sportsmot` link-prediction head — via a
# subprocess bridge to the isolated `external-trackers/` venvs. `matchlab-run`
# with this config works end-to-end on any clip: the `tdlp-full` stage
# fabricates the MOT-sequence layout the external tools need from the pipeline's
# own frames + detections, shells out to each venv, and returns native
# tracklets. Requires the external-trackers checkout + its two venvs + weights;
# the stage fails early with a pointed message if any are missing.
#
# The detector below is orthogonal — TDLP-full tracks whatever the DETECT slot
# produces. Swap `detect` for `frozen`/`oracle` to isolate the tracker from the
# detector when benchmarking (see the *-frozen-eval configs for that pattern).
name: tdlp-full
description: >
  SOTA TDLP-full tracker (RTMPose + KPR appearance + released tdlp_sportsmot
  head) as a native TRACK stage, bridged to the external-trackers venvs.
sport: soccer
pitch: fifa
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: yolo-local
    params:
      # Detector selected 2026-08-01 (docs/reports/2026-08-01-detector-selection.md):
      # held-out player AP@0.5 0.803 -> 0.919, ball F1 0.368 -> 0.663, and
      # end-to-end HOTA (tracklet) 0.502 -> 0.618 / ID switches -59%.
      # imgsz 960 and confidence 0.4 are both measured optima, not defaults.
      weights: data/weights/football-player-detection-mobadam.pt
      imgsz: 960
      confidence: 0.4
  track:
    impl: tdlp-full
    params:
      # external_root defaults to ~/code/sport-stats/external-trackers; all
      # other paths resolve under it. Override only for a non-default checkout.
      device: cuda:0
      timeout_s: 7200.0
      keep_work: false
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  # PnLCalib rebuild (SPO-62..66/70/84) -- the current calibration system.
  # `pitch: fifa` above is required: the adapter emits homographies in real
  # 105x68 m geometry.
  calibrate:
    impl: pnlcalib
    params:
      command:
        - "../external-calibrators/PnLCalib/.venv/bin/python"
        - "../external-calibrators/pnlcalib_cli.py"
      weights_kp: "../external-calibrators/PnLCalib/weights/SV_kp"
      weights_line: "../external-calibrators/PnLCalib/weights/SV_lines"
      kp_threshold: 0.3434
      line_threshold: 0.7867
      pnl_refine: true
      device: cuda:0
      max_gap_frames: 150
      outlier_threshold_cm: 2500.0
      smoothing_window: 15
  # DELIBERATELY the legacy associate stage: this config isolates the TRACK
  # slot, so association is held at the incumbent to keep tracker comparisons
  # clean. For the current best association (reid-engine, two-pass, jersey
  # channel on) use pipeline.tdlp-full-reid.yaml or pipeline.full-e2e-jersey.yaml.
  associate:
    impl: global-color
    params:
      max_gap_s: 20.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
