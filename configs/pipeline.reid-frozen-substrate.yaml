# SPO-59 replay substrate: score associate-layer variants on byte-identical
# TDLP-full tracklets without re-running the GPU tracker. The frozen-tracklets
# stage replays a Phase A base run's tracklets.json + frame_features.npz per
# sequence; benchmark candidates override stages.track.params.runs_dir to the
# concrete Phase A workdir and stages.associate.* to the arm under test.
# fuse/events/annotate are disabled: this substrate exists to be evaluated,
# not watched. Oracle detections keep the detection eval layer comparable
# with the base runs.
name: reid-frozen-substrate
description: >
  Frozen TDLP-full tracklet replay + swappable associate arm, for the SPO-59
  do-no-harm gate and anchor-economics sweep.
sport: soccer
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: oracle
    params: {}
  track:
    impl: frozen-tracklets
    params:
      # Always overridden by the benchmark candidate to the Phase A workdir's
      # runs/ dir; resolves <runs_dir>/*-<video-stem> per sequence.
      runs_dir: data/experiments/OVERRIDE_ME/runs
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: static-demo
    enabled: false
  associate:
    impl: reid-engine
    params:
      # >1.0 disables similarity-only merging: anchor-driven merges bypass this
      # gate by design, so the engine merges on anchor evidence alone. SPO-59
      # tuning measurement: similarity merging at its calibrated best (0.95)
      # bought +0.004 entity IDF1 over anchor-only but failed do-no-harm on
      # entity purity; anchor-only matched no-op purity exactly. Set 0.95 (the
      # calibrated threshold) to re-enable similarity merging.
      min_similarity: 1.01
      overlap_tolerance_frames: 2
      max_prototypes: 4
      view_threshold: 0.7
      starved_max_frames: 2
      min_part_visibility: 0.3
      max_speed_px_s: 800.0
      max_speed_cm_s: 900.0
      soft_gap_s: 15.0
      gmc: true
      gmc_downscale: 2
      calibration_min_confidence: 0.5
      anchor_source: oracle-jersey
      anchor_coverage: 1.0
      anchor_noise: 0.0
      anchor_min_box_height: 0.0
      anchor_seed: 0
      min_posterior: 0.6
      min_margin: 0.2
      sinkhorn_iterations: 2
      tier_auto_min_posterior: 0.85
      tier_auto_min_margin: 0.5
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    enabled: false
  events:
    impl: possession-heuristic
    enabled: false
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    enabled: false
