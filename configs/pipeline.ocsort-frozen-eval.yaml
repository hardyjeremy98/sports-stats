# PHASE 3 CANDIDATE (SPO-33) -- OC-SORT over frozen reference detections.
# Identical to configs/pipeline.v1-hardened-frozen-eval.yaml EXCEPT the track
# stage is `ocsort` (motion-model ablation: no appearance, no CMC). Same frozen
# detect input and same downstream stages, so raw-tracklet metrics are directly
# comparable to the hardened-frozen comparator on identical detections.
#
# exchange_dir is overridden per tier by the benchmark config. Calibrate needs
# ultralytics at runtime (AGPL, local-eval only).
name: ocsort-frozen-eval
description: >
  Phase 3 candidate (SPO-33): OC-SORT over frozen reference detections.
  Motion-model ablation vs the hardened BoT-SORT comparator.
sport: soccer
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: frozen
    params:
      exchange_dir: data/exchange/frozen-detections/soccernet  # overridden per tier
  track:
    impl: ocsort
    params:
      lost_track_buffer_s: 1.0
      minimum_consecutive_frames: 3
      minimum_iou_threshold: 0.3
      direction_consistency_weight: 0.2
      high_conf_det_threshold: 0.4
      delta_t: 3
      min_length: 5
      state_estimator: xcycsr
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: yolo-pitch-local
    params:
      weights: data/weights/football-pitch-detection.pt
      keypoint_confidence: 0.5
  associate:
    impl: global-color
    params:
      max_gap_s: 20.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
