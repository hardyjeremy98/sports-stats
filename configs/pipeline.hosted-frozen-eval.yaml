# FROZEN HOSTED INCUMBENT DETECTIONS (SPO-26) -- Phase 2, SoccerNet tier.
# This config freezes the SHIPPING incumbent detector (roboflow-hosted
# football-players-detection-3zvbc/11, the same model id as
# configs/pipeline.v1.yaml) via the hosted-detection response cache
# (SPO-10 part 2, pitchlab_core/stages/detect/hosted_cache.py), so its
# responses become replayable inputs for Phase 2/3 comparison work instead of
# re-hitting the network on every experiment run. This candidate IS the
# incumbent -- the reference point the tier is measured against, not a new
# detector -- captured once at cache_mode=readwrite and replayed thereafter.
#
# confidence is 0.1 here, NOT the shipping default of 0.3
# (configs/pipeline.v1.yaml / pipeline.v1-hardened-eval.yaml): capturing at a
# lower floor keeps low-score material in the frozen cache for Phase 3
# low-score-association experiments, which a 0.3 capture would have already
# discarded. The hosted_cache cache key includes `confidence` (see
# hosted_cache.cache_key), so this frozen cache is bound to 0.1 -- any config
# that reads this cache_dir at a different confidence will look like a cold
# cache (cache misses), not a corrupted one.
#
# Everything except `detect:` is copied byte-identical from
# pipeline.v1-hardened-eval.yaml (SPO-22 hardened BoT-SORT + stride 1), the
# same pattern Task 3's pipeline.yolox-sportsmot-eval.yaml used for the
# SportsMOT tier -- the only variable versus that baseline is the detector.
#
# Step 1 finding (packages/pitchlab_core/src/pitchlab_core/stages/detect/roboflow.py):
# the `roboflow` detect impl uses the Roboflow `inference` package's
# `get_model()` / `model.infer()`, which runs inference LOCALLY (onnxruntime)
# after an initial authenticated model-artifact fetch -- it is NOT a
# per-frame hosted HTTP call, so there is no per-frame API quota/rate-limit
# exposure for the ~9000 frames across the 12 sequences. ROBOFLOW_API_KEY
# (env var) is required at `prepare()` time to construct the model (skipped
# entirely in cache_mode=replay, which needs no key). Params used below match
# roboflow.py's `Params`: player_model_id, use_ball_model, confidence,
# cache_mode, cache_dir (ball_model_id/ball_buffer_size/ball_max_gap_frames
# left at their Params defaults since use_ball_model is false).
#
# AGPL weights: none used by this detect impl (roboflow-hosted, proprietary
# license -- see roboflow.py's ModelProvenance). calibrate (yolo-pitch-local)
# still needs ultralytics (AGPL) at runtime -- LOCAL EVAL ONLY, never shipped,
# same as every other *-eval.yaml in this repo.
#
# Environment requirement for re-capture (cache_mode=readwrite) on this box:
# DEFAULT_DEVICE=cpu must be set. The `inference` package's model loader
# (called from roboflow.py's `prepare()`, `get_model()`) auto-selects a CUDA
# backend when torch reports a GPU present, but this box lacks the
# pycuda / GPU-onnxruntime extras that backend needs, so an unset
# DEFAULT_DEVICE causes `prepare()` to fail on this box. Replaying from the
# already-frozen cache (cache_mode=replay) does NOT need DEFAULT_DEVICE=cpu:
# `prepare()` returns immediately in replay mode without calling `get_model()`
# at all, so no model (and no backend selection) is ever loaded.
name: hosted-frozen-eval
description: >
  Frozen hosted incumbent (SPO-26): roboflow football-players-detection-3zvbc/11
  captured at confidence 0.1 via the hosted-detection response cache, +
  the SPO-22 hardened BoT-SORT tracker, every frame (stride 1). This
  candidate IS the SoccerNet tier's incumbent, frozen for replay.
sport: soccer
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: roboflow
    params:
      player_model_id: football-players-detection-3zvbc/11
      use_ball_model: false
      confidence: 0.1
      cache_mode: readwrite
      cache_dir: data/cache/hosted-detections
  track:
    impl: botsort
    params:
      track_activation_threshold: 0.25
      lost_track_buffer_s: 1.0
      minimum_consecutive_frames: 3
      min_length: 5
      enable_cmc: true
      minimum_iou_threshold_first_assoc: 0.2
      minimum_iou_threshold_second_assoc: 0.5
      minimum_iou_threshold_unconfirmed_assoc: 0.3
      high_conf_det_threshold: 0.4
      cmc_method: sparseOptFlow
      cmc_downscale: 2
      instant_first_frame_activation: true
      state_estimator: xcycwh
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: yolo-pitch-local
    params:
      weights: data/weights/football-pitch-detection.pt
      keypoint_confidence: 0.5
  associate:
    impl: global-color
    params:
      max_gap_s: 20.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
