# Local-weights evaluation recipe: the roboflow/sports fine-tuned YOLOv8x
# models run via ultralytics (AGPL — LOCAL EVAL ONLY, never ship; see
# technology/10-libraries.md). No API key needed. Weights land in
# data/weights/ via the gdrive links in roboflow/sports setup.sh.
name: v1-local-eval
description: >
  Real models, no API key: local fine-tuned YOLOv8x detection + pitch keypoints,
  BoT-SORT tracking, kit-color teams, global association, heuristic possession.
  AGPL weights - evaluation only.
sport: soccer
video:
  sample_stride: 2
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: yolo-local
    params:
      weights: data/weights/football-player-detection.pt
      imgsz: 1280
      confidence: 0.3
  track:
    impl: botsort
    params:
      # All BoT-SORT constructor params stated explicitly (SPO-15) so the
      # manifest snapshot is self-describing and every axis is sweep-ready
      # (SPO-22). Values below are this wrapper's pre-SPO-15 defaults, which
      # for track_activation_threshold/minimum_consecutive_frames already
      # deliberately override the `trackers` library's own defaults (see
      # comments in stages/track/botsort.py::Params) -- everything else is
      # the library's own default, copied verbatim.
      track_activation_threshold: 0.25
      lost_track_buffer_s: 1.0
      minimum_consecutive_frames: 3
      min_length: 5
      enable_cmc: true
      minimum_iou_threshold_first_assoc: 0.2
      minimum_iou_threshold_second_assoc: 0.5
      minimum_iou_threshold_unconfirmed_assoc: 0.3
      high_conf_det_threshold: 0.6
      cmc_method: sparseOptFlow
      cmc_downscale: 2
      instant_first_frame_activation: true
      state_estimator: xcycwh
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: yolo-pitch-local
    params:
      weights: data/weights/football-pitch-detection.pt
      keypoint_confidence: 0.5
  associate:
    impl: global-color
    params:
      max_gap_s: 20.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
