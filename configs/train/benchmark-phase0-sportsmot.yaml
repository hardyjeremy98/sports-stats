# SPO-21 Phase 0 exit gate -- SportsMOT held-out tier.
#
# Identical candidate matrix to benchmark-phase0-soccernet.yaml, over the
# SportsMOT held-out subset (SPO-16: 6 sequences, 2 each football/basketball/
# volleyball). NOTE: the baseline detector weights are football-specialised
# (data/weights/football-player-detection.pt); expect weak detection on the
# basketball/volleyball sequences. That is itself a Phase 0 finding -- the
# oracle candidate isolates the tracker ceiling regardless of detector fit,
# so the baseline-vs-oracle gap on non-football sequences reads mostly as
# detector-domain-mismatch, not tracker failure.
#
# HELD-OUT tier: one-shot final reporting numbers only.
# Pre-registered tolerances: identical to the SoccerNet gate config.
name: benchmark-phase0-sportsmot
task: benchmark
description: Phase 0 gate -- baseline vs oracle tracker-ceiling on SportsMOT held-out.
params:
  dataset_manifest: configs/datasets/sportsmot.json
  roles: [held_out]
  candidates:
    - name: baseline-botsort
      kind: pipeline
      config: configs/pipeline.v1-local-eval.yaml
      comparison_class: matched_data
      oracle_candidate: oracle-botsort
    - name: oracle-botsort
      kind: pipeline
      config: configs/pipeline.oracle-botsort-eval.yaml
      comparison_class: matched_data
  compare:
    baseline: baseline-botsort
  tolerances:
    idf1_tracklet: 0.005
    idf1_entity: 0.005
    hota_tracklet: 0.005
    hota_entity: 0.005
    mota_entity: 0.005
    tracklet_purity: 0.005
    idsw_tracklet: 1
    idsw_entity: 1
    mixed_track_seconds: 0.5
  device: cuda
  iou_threshold: 0.5
output_dir: data/experiments
