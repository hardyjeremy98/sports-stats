# SPO-35 -- CAMELTrack as-published reference row, SportsMOT held-out.
# CAMELTrack (Apache-2.0, TrackingLaboratory/CAMELTrack) run via TrackLab with
# its released SportsMOT tracker-state (own YOLOX detector + pose + KPR-ReID)
# and the camel_bbox_app_kps_sportsmot.ckpt checkpoint (native multi-cue +
# pose; breaks frozen-detection parity -> REFERENCE row, not a promotion
# candidate; NOT bound by the SPO-29 §4 guardrails). MOT output imported via
# the SPO-18 adapter (reference_only=true, comparison_class=as_published).
# v_0kUtTtmLaJA_c004 excluded: a state video_id-alignment quirk left it empty
# (see report); the other 5 held-out seqs align correctly.
# Run: uv run --with ultralytics pitchlab-train run \
#   configs/train/benchmark-phase3-spo35-sportsmot.yaml
name: benchmark-phase3-spo35-sportsmot
task: benchmark
description: SPO-35 CAMELTrack as-published reference (import adapter) -- SportsMOT held-out (5/6).
params:
  dataset_manifest: configs/datasets/sportsmot.json
  roles: [held_out]
  device: cuda
  iou_threshold: 0.5
  candidates:
    - name: cameltrack-aspub
      kind: import
      comparison_class: as_published
      runs:
        v_00HRwkvvjtQ_c001: data/exchange/external-runs/cameltrack/sportsmot/v_00HRwkvvjtQ_c001
        v_2QhNRucNC7E_c017: data/exchange/external-runs/cameltrack/sportsmot/v_2QhNRucNC7E_c017
        v_4-EmEtrturE_c009: data/exchange/external-runs/cameltrack/sportsmot/v_4-EmEtrturE_c009
        v_4r8QL_wglzQ_c001: data/exchange/external-runs/cameltrack/sportsmot/v_4r8QL_wglzQ_c001
        v_G-vNjfx1GGc_c004: data/exchange/external-runs/cameltrack/sportsmot/v_G-vNjfx1GGc_c004
output_dir: data/experiments
