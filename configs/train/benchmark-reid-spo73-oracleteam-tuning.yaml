# SPO-73 decontaminated tuning grid (oracle teams): the amendment run — every
# input around the merge rule is GT/oracle-pinned (oracle detections, frozen
# tracklets/features, ORACLE team stage). Kit-color noise (SNMOT-116 collapse,
# SPO-75) contaminated the original grid; this supersedes it. Anchorless.
name: benchmark-reid-spo73-oracleteam-tuning
task: benchmark
description: >
  SPO-73 amendment: anchorless mutual-best+margin grid with oracle teams on
  tuning sequences over the frozen substrate.
params:
  dataset_manifest: configs/datasets/soccernet.json
  roles: [tuning]
  candidates:
    - name: noop-per-tracklet
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.impl: per-tracklet
        stages.associate.params: {}
      comparison_class: matched_data
    - name: v1-threshold-0.95
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.min_similarity: 0.95
      comparison_class: matched_data
    - name: mb-m0.0
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.merge_decision_rule: mutual-best
        stages.associate.params.merge_min_margin: 0.0
        stages.associate.params.min_similarity: 0.9
      comparison_class: matched_data
    - name: mb-m0.02
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.merge_decision_rule: mutual-best
        stages.associate.params.merge_min_margin: 0.02
        stages.associate.params.min_similarity: 0.9
      comparison_class: matched_data
    - name: mb-m0.05
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.merge_decision_rule: mutual-best
        stages.associate.params.merge_min_margin: 0.05
        stages.associate.params.min_similarity: 0.9
      comparison_class: matched_data
    - name: mb-m0.06
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.merge_decision_rule: mutual-best
        stages.associate.params.merge_min_margin: 0.06
        stages.associate.params.min_similarity: 0.9
