      param: stages.associate.params.min_similarity
      values: [0.5, 0.8, 0.95]
    - candidate: mb-m0.02
      param: stages.associate.params.min_similarity
      values: [0.5, 0.8, 0.95]
    - candidate: mb-m0.05
      param: stages.associate.params.min_similarity
      values: [0.5, 0.8, 0.95]
    - candidate: mb-m0.06
