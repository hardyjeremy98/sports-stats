# SPO-73 decontaminated held-out gate (oracle teams): pre-registration #2 on
# the SPO-73 Linear issue (2026-07-24). Primary: anchorless mutual-best,
# margin 0.07, floor 0.95. Do not edit without re-registering.
name: benchmark-reid-spo73-oracleteam-gate-heldout
task: benchmark
description: >
  SPO-73 amendment: decontaminated held-out gate, oracle teams, anchorless
  mutual-best at the re-registered operating point vs no-op.
params:
  dataset_manifest: configs/datasets/soccernet.json
  roles: [held_out]
  candidates:
    - name: noop-per-tracklet
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.impl: per-tracklet
        stages.associate.params: {}
      comparison_class: matched_data
    - name: mb-primary
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.merge_decision_rule: mutual-best
        stages.associate.params.merge_min_margin: 0.07
        stages.associate.params.min_similarity: 0.95
      comparison_class: matched_data
    - name: mb-shadow-m0.1-f0.9
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.merge_decision_rule: mutual-best
        stages.associate.params.merge_min_margin: 0.1
        stages.associate.params.min_similarity: 0.9
      comparison_class: matched_data
    - name: v1-threshold-0.95
      kind: pipeline
      config: configs/pipeline.reid-frozen-substrate.yaml
      overrides:
        stages.track.params.runs_dir: data/experiments/benchmark-reid-b2-base-20260724-035932/runs
        stages.team.impl: oracle
        stages.team.params: {}
        stages.associate.params.anchor_source: none
        stages.associate.params.min_similarity: 0.95
      comparison_class: matched_data
  sweeps: []
  device: cuda
  iou_threshold: 0.5
  compare:
    baseline: noop-per-tracklet
  tolerances:
    entity_purity: 0.0
    idf1_entity: 0.0
    hota_entity: 0.0
output_dir: data/experiments
