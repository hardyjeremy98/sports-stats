# TIER: LIVE (see configs/README.md) -- tracks the current best in every slot; upgrade on promotion.
# Oracle-detection condition for the B2 re-ID engine (SPO-59 primary
# condition, matching the existing TDLP-full run protocol): GT boxes stand in
# for the detector so merging/naming quality is measured with detection
# quality held perfect. Point at a GT-backed video (sibling `<video>.gt.json`,
# e.g. ingested via `matchlab-train ingest-soccernet`). Calibrate is disabled
# on purpose: a synthetic homography would feed bogus metric speeds into the
# engine's opportunistic motion gate — no calibration means the gate honestly
# falls back to the GMC pixel bound. Requires the external-trackers checkout
# (see configs/pipeline.tdlp-full.yaml).
name: tdlp-full-reid-oracle
description: >
  Oracle (GT-box) detections + SOTA TDLP-full tracker + reid-engine
  association with oracle jersey anchors: the re-ID engine benchmark's
  primary condition.
sport: soccer
# Required by the PnLCalib calibrate stage below: its adapter emits homographies
# in real 105x68 m FIFA geometry, so the runner, minimap and every metric
# consumer must share that spec.
pitch: fifa
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: oracle
    params: {}
  track:
    impl: tdlp-full
    params:
      device: cuda:0
      timeout_s: 7200.0
      keep_work: false
      # Backbone for the re-ID feature artifact (Jeremy, 2026-07-25). The
      # tracker still runs KPR internally; this is the ASSOCIATE layer's input.
      reid_model: prtreid
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  # Calibration was `enabled: false` here until 2026-07-27, which meant the
  # merge engine's pitch-metric motion branch (reid/gates.py) NEVER fired in any
  # benchmarked re-ID run -- SPO-59, SPO-73, SPO-85 and the 2026-07-26 smoke all
  # scored on the GMC pixel bound alone. Position evidence needs pitch
  # coordinates, so PnLCalib is on. `pitch: fifa` above is required: the adapter
  # emits homographies in real 105x68 m geometry.
  calibrate:
    impl: pnlcalib
    params:
      command:
        - "../external-calibrators/PnLCalib/.venv/bin/python"
        - "../external-calibrators/pnlcalib_cli.py"
      weights_kp: "../external-calibrators/PnLCalib/weights/SV_kp"
      weights_line: "../external-calibrators/PnLCalib/weights/SV_lines"
      kp_threshold: 0.3434
      line_threshold: 0.7867
      pnl_refine: true
      device: cuda:0
      max_gap_frames: 150
      outlier_threshold_cm: 2500.0
      smoothing_window: 15
  associate:
    impl: reid-engine
    params:
      # Permissive merging, adopted 2026-07-26 (SPO-85): mutual-best at zero
      # margin, floor 0.80. Measured on GT fragments: entity IDF1 0.9536 vs
      # 0.8502 no-op, identity switches 125 -> 41, entity purity 0.986.
      # Deliberately admits ~15% wrong merges so downstream work can see them;
      # this FAILS the zero-tolerance do-no-harm gate by design. Raise
      # merge_min_margin to 0.04 for the conservative end of the curve.
      min_similarity: 0.80
      merge_decision_rule: mutual-best
      merge_min_margin: 0.0
      overlap_tolerance_frames: 2
      max_prototypes: 4
      view_threshold: 0.7
      starved_max_frames: 2
      min_part_visibility: 0.3
      max_speed_px_s: 800.0
      max_speed_cm_s: 900.0
      soft_gap_s: 15.0
      gmc: true
      gmc_downscale: 2
      calibration_min_confidence: 0.5
      # Jersey-OCR merge channel ON by default (Jeremy, 2026-08-01) after the
      # anchor-free engine A/B on held-out SNMOT-124..127: merge precision
      # 0.75 -> 0.82, mean entity IDF1 0.851 -> 0.866, no regressions on any
      # clip. Worker needs the enriched deps (pytorch_lightning, nltk) and
      # the parseq/legibility checkpoints in data/weights/.
      jersey_enabled: true
      anchor_source: oracle-jersey
      anchor_coverage: 1.0
      anchor_noise: 0.0
      anchor_min_box_height: 0.0
      anchor_seed: 0
      min_posterior: 0.6
      min_margin: 0.2
      tier_auto_min_posterior: 0.85
      tier_auto_min_margin: 0.5
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
