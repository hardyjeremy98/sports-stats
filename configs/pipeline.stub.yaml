# Keyless/GPU-less recipe: deterministic synthetic detections + dependency-free
# stages. Runs anywhere `pitchlab-core` installs; powers `make demo`, tests,
# and UI development. Pair with a video rendered by `pitchlab-demo` so the
# detections match the pixels.
name: stub-synthetic
description: Synthetic detector + IoU tracker + kit-color teams + static camera. No models, no keys, no GPU.
sport: soccer
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: synthetic
    params:
      dropout_rate: 0.05
  track:
    impl: iou
    params:
      iou_threshold: 0.2
      max_age_frames: 20
  team:
    impl: kit-color
    params: {}
  calibrate:
    impl: static-demo
    params: {}
  associate:
    impl: global-color
    params:
      max_color_distance: 35.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.5
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 250.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
