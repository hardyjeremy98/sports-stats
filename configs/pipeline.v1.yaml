# The v1 production recipe: roboflow/sports hosted models + BoT-SORT.
# Requires ROBOFLOW_API_KEY and `pip install 'pitchlab-core[cv]'`
# (+ [face] extra for the identity stage — or set identity impl to "none").
name: v1-default
description: >
  Roboflow fine-tuned detection, BoT-SORT tracking, SigLIP team clustering,
  keypoint homography with temporal smoothing, global tracklet association,
  face identity, heuristic possession events.
sport: soccer
video:
  sample_stride: 2        # detection tolerates 12-15 fps; halves GPU cost
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: roboflow
    params:
      player_model_id: football-players-detection-3zvbc/11
      ball_model_id: football-ball-detection-rejhg/2
      use_ball_model: false   # enable for wide shots where the ball is tiny
      confidence: 0.3
      # Hosted-detection response cache (SPO-10 part 2): frozen, replayable
      # detections instead of live-only hosted-API calls.
      cache_dir: data/cache/hosted-detections
      cache_mode: readwrite
  track:
    impl: botsort
    params:
      # All BoT-SORT constructor params stated explicitly (SPO-15) so the
      # manifest snapshot is self-describing and every axis is sweep-ready
      # (SPO-22). Values below are this wrapper's pre-SPO-15 defaults, which
      # for track_activation_threshold/minimum_consecutive_frames already
      # deliberately override the `trackers` library's own defaults (see
      # comments in stages/track/botsort.py::Params) -- everything else is
      # the library's own default, copied verbatim.
      track_activation_threshold: 0.25
      lost_track_buffer_s: 1.0
      minimum_consecutive_frames: 3
      min_length: 5
      enable_cmc: true
      minimum_iou_threshold_first_assoc: 0.2
      minimum_iou_threshold_second_assoc: 0.5
      minimum_iou_threshold_unconfirmed_assoc: 0.3
      high_conf_det_threshold: 0.6
      cmc_method: sparseOptFlow
      cmc_downscale: 2
      instant_first_frame_activation: true
      state_estimator: xcycwh
  team:
    impl: siglip-kmeans
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: roboflow-keypoints
    params:
      keypoint_confidence: 0.5
      ema_alpha: 0.9
  associate:
    impl: global-color
    params:
      max_gap_s: 20.0
  identity:
    impl: face
    params:
      upscaler: none        # 'realesrgan' to A/B upscaling in the Lab
      candidates_per_entity: 6
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false          # v2 seam: learned action spotting
  annotate:
    impl: overlay
    params: {}
