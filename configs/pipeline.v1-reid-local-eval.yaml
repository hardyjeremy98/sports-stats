# TIER: PORTABLE-LIVE (see configs/README.md) -- the OSNet body-re-ID variant
# of pipeline.v1-local-eval.yaml, identical to it except the `associate:` slot.
#
# NOT the current best association. `global-reid`/OSNet is the legacy single-
# embedding associate stage; the current best is the `reid-engine` two-pass
# merge engine, which consumes TDLP-full's exported KPR/PRTreID features and so
# cannot run behind BoT-SORT -- see pipeline.full-e2e-jersey.yaml. Body
# appearance alone has since measured 0 correct merges at zero-wrong on
# held-out oracle fragments (docs/reports/2026-08-01-jersey-ocr-channel.md), so
# treat this config as an in-repo-only fallback, not a contender.
name: v1-reid-local-eval
description: >
  Portable-live stack with legacy OSNet body-re-ID association: mobadam local
  YOLO detection @960, BoT-SORT tracking, kit-color teams, local pitch
  keypoints, global-reid association, heuristic possession.
sport: soccer
video:
  # Stride 1, matching v1-local-eval -- see the SPO-22 note there.
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: yolo-local
    params:
      # Detector selected 2026-08-01 (docs/reports/2026-08-01-detector-selection.md):
      # held-out player AP@0.5 0.803 -> 0.919, ball F1 0.368 -> 0.663, and
      # end-to-end HOTA (tracklet) 0.502 -> 0.618 / ID switches -59%.
      # imgsz 960 and confidence 0.4 are both measured optima, not defaults.
      weights: data/weights/football-player-detection-mobadam.pt
      imgsz: 960
      confidence: 0.4
  track:
    impl: botsort
    params:
      # All BoT-SORT constructor params stated explicitly (SPO-15) so the
      # manifest snapshot is self-describing and every axis is sweep-ready
      # (SPO-22). Values below are this wrapper's pre-SPO-15 defaults, which
      # for track_activation_threshold/minimum_consecutive_frames already
      # deliberately override the `trackers` library's own defaults (see
      # comments in stages/track/botsort.py::Params) -- everything else is
      # the library's own default, copied verbatim.
      track_activation_threshold: 0.25
      lost_track_buffer_s: 1.0
      minimum_consecutive_frames: 3
      min_length: 5
      enable_cmc: true
      minimum_iou_threshold_first_assoc: 0.2
      minimum_iou_threshold_second_assoc: 0.5
      minimum_iou_threshold_unconfirmed_assoc: 0.3
      # 0.4, not the library default 0.6 -- see the SPO-22 note in
      # pipeline.v1-local-eval.yaml.
      high_conf_det_threshold: 0.4
      cmc_method: sparseOptFlow
      cmc_downscale: 2
      instant_first_frame_activation: true
      state_estimator: xcycwh
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: yolo-pitch-local
    params:
      weights: data/weights/football-pitch-detection.pt
      keypoint_confidence: 0.5
  associate:
    impl: global-reid
    params:
      embedder: osnet
      max_embed_distance: 0.25   # placeholder until ablation calibration
      max_gap_s: 20.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
