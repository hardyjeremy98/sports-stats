# TIER: LIVE (see configs/README.md) -- tracks the current best in every slot; upgrade on promotion.
# TDLP-full substrate + the B2 re-ID engine in the ASSOCIATE slot (SPO-53).
# The engine consumes the tracker's own per-frame KPR/pose features
# (frame_features.npz, exported by the tdlp-full stage) and owns the whole
# tracklet -> named-entity path, so the identity slot is `none` by design —
# the slot survives as a seam for other experiments. See
# configs/pipeline.tdlp-full.yaml for the external-trackers requirements.
name: tdlp-full-reid
description: >
  SOTA TDLP-full tracker + reid-engine association: constraint-gated tracklet
  merging over the tracker's own part-based features, closed-roster naming
  with abstention. Identity slot deliberately none.
sport: soccer
pitch: fifa
video:
  sample_stride: 1
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: yolo-local
    params:
      # Detector selected 2026-08-01 (docs/reports/2026-08-01-detector-selection.md):
      # held-out player AP@0.5 0.803 -> 0.919, ball F1 0.368 -> 0.663, and
      # end-to-end HOTA (tracklet) 0.502 -> 0.618 / ID switches -59%.
      # imgsz 960 and confidence 0.4 are both measured optima, not defaults.
      weights: data/weights/football-player-detection-mobadam.pt
      imgsz: 960
      confidence: 0.4
  track:
    impl: tdlp-full
    params:
      device: cuda:0
      timeout_s: 7200.0
      keep_work: false
      # Backbone for the re-ID feature artifact (Jeremy, 2026-07-25). The
      # tracker still runs KPR internally; this is the ASSOCIATE layer's input.
      reid_model: prtreid
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  # PnLCalib rebuild (SPO-62..66/70/84) -- the current calibration system.
  # `pitch: fifa` above is required: the adapter emits homographies in real
  # 105x68 m geometry.
  calibrate:
    impl: pnlcalib
    params:
      command:
        - "../external-calibrators/PnLCalib/.venv/bin/python"
        - "../external-calibrators/pnlcalib_cli.py"
      weights_kp: "../external-calibrators/PnLCalib/weights/SV_kp"
      weights_line: "../external-calibrators/PnLCalib/weights/SV_lines"
      kp_threshold: 0.3434
      line_threshold: 0.7867
      pnl_refine: true
      device: cuda:0
      max_gap_frames: 150
      outlier_threshold_cm: 2500.0
      smoothing_window: 15
  associate:
    impl: reid-engine
    params:
      # Permissive merging, adopted 2026-07-26 (SPO-85): mutual-best at zero
      # margin, floor 0.80. Measured on GT fragments: entity IDF1 0.9536 vs
      # 0.8502 no-op, identity switches 125 -> 41, entity purity 0.986.
      # Deliberately admits ~15% wrong merges so downstream work can see them;
      # this FAILS the zero-tolerance do-no-harm gate by design. Raise
      # merge_min_margin to 0.04 for the conservative end of the curve.
      min_similarity: 0.80
      merge_decision_rule: mutual-best
      merge_min_margin: 0.0
      overlap_tolerance_frames: 2
      # Representation (SPO-54)
      max_prototypes: 4
      view_threshold: 0.7
      starved_max_frames: 2
      min_part_visibility: 0.3
      # Constraint gates (SPO-55): sharp GMC pixel bound for short gaps,
      # opportunistic pitch-metric bound where calibration covers both
      # endpoints, deliberately soft beyond soft_gap_s.
      max_speed_px_s: 800.0
      max_speed_cm_s: 900.0
      soft_gap_s: 15.0
      gmc: true
      gmc_downscale: 2
      calibration_min_confidence: 0.5
      # Anchor layer (SPO-56): oracle jersey anchors from the video's GT
      # (benchmark condition; needs ingested GT next to the video). Set
      # anchor_source: none for anchor-free runs.
      # Jersey-OCR merge channel ON by default (Jeremy, 2026-08-01) after the
      # anchor-free engine A/B on held-out SNMOT-124..127: merge precision
      # 0.75 -> 0.82, mean entity IDF1 0.851 -> 0.866, no regressions on any
      # clip. Worker needs the enriched deps (pytorch_lightning, nltk) and
      # the parseq/legibility checkpoints in data/weights/.
      jersey_enabled: true
      anchor_source: oracle-jersey
      anchor_coverage: 1.0
      anchor_noise: 0.0
      anchor_min_box_height: 0.0
      anchor_seed: 0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
