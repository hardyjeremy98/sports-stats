# TIER: FROZEN (see configs/README.md) -- comparability baseline -- do not retune; its numbers are published.
# Oracle counterpart of pipeline.v1-local-eval.yaml (SPO-21 Phase 0 gate):
# GT boxes stand in for the detector so the BoT-SORT tracker is measured with
# detection quality held perfect -- the "tracker ceiling" of the current
# baseline tracker. Every other stage (track params, sample_stride, team,
# calibrate, associate, fuse, events) is byte-identical to v1-local-eval so
# the only difference from the baseline is the detector. This is the
# `oracle_candidate` of the v1-local-eval baseline in the gate configs, which
# also requires an identical track stage + sample_stride (SPO-19 validation).
name: oracle-botsort-eval
description: >
  Oracle (GT-box) detector + the v1-local-eval BoT-SORT tracker and downstream
  stages. Detector-independent tracker-ceiling counterpart of v1-local-eval.
sport: soccer
video:
  sample_stride: 2
  max_frames: null
  resize_width: null
stages:
  detect:
    impl: oracle
    params: {}
  track:
    impl: botsort
    params:
      track_activation_threshold: 0.25
      lost_track_buffer_s: 1.0
      minimum_consecutive_frames: 3
      min_length: 5
      enable_cmc: true
      minimum_iou_threshold_first_assoc: 0.2
      minimum_iou_threshold_second_assoc: 0.5
      minimum_iou_threshold_unconfirmed_assoc: 0.3
      high_conf_det_threshold: 0.6
      cmc_method: sparseOptFlow
      cmc_downscale: 2
      instant_first_frame_activation: true
      state_estimator: xcycwh
  team:
    impl: kit-color
    params:
      crops_per_tracklet: 8
  calibrate:
    impl: yolo-pitch-local
    params:
      weights: data/weights/football-pitch-detection.pt
      keypoint_confidence: 0.5
  associate:
    impl: global-color
    params:
      max_gap_s: 20.0
  identity:
    impl: none
    params: {}
  fuse:
    impl: minimap
    params:
      smoothing_alpha: 0.6
  events:
    impl: possession-heuristic
    params:
      possession_radius_cm: 200.0
  spotting:
    impl: none
    enabled: false
  annotate:
    impl: overlay
    params: {}
