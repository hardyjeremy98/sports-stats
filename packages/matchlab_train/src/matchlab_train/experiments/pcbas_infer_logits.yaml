# Stage 1 inference: write the frozen (9,26,T) contract for every VAL half.
# ~0.32 s per 50-frame window at stride 25; a 90-minute half is ~3,000 windows.
name: pcbas-infer-logits-val
task: pcbas-infer-logits
description: Run the trained action head over VAL, writing avg_logits_<half>.npy.
output_dir: data/experiments
params:
  h5_path: data/footpass/tactical/val_tactical_data.h5
  video_root: data/footpass/videos_352x640
  # action_head_selected.pt, NOT action_head_best.pt. `best` is chosen during
  # training on a small validation subsample; `selected` is chosen afterwards by
  # re-scoring EVERY kept epoch. Pointing this config at `best` reproduced a
  # different, worse number than the one reported under the same experiment name.
  checkpoint: data/weights/pcbas/action_head_selected.pt
  out_dir: data/footpass/logits/val
