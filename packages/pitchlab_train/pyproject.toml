[project]
name = "pitchlab-train"
version = "0.1.0"
description = "PitchLab config-driven training: dataset adapters, fine-tuning experiments, QA-label export"
requires-python = ">=3.11"
dependencies = [
    "pitchlab-core",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy training backends, opt-in per experiment type.
detector = [
    "rfdetr>=1.0",          # Apache-2.0 detector (no AGPL ultralytics weights)
    "roboflow>=1.1",        # dataset download from Roboflow Universe
]
# QA-label export reads the server's database.
qa = ["pitchlab-server"]

[project.scripts]
pitchlab-train = "pitchlab_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchlab_train"]
