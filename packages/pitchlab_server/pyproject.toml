[project]
name = "pitchlab-server"
version = "0.1.0"
description = "PitchLab API server, job queue worker, and QA queue"
requires-python = ">=3.11"
dependencies = [
    "pitchlab-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
pitchlab-worker = "pitchlab_server.worker:main"
pitchlab-demo = "pitchlab_server.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchlab_server"]
